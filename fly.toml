app = "recall-memory"
primary_region = "bos"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1   # keep one warm: the demo is live at 20:00

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
